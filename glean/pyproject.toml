[project]
name = "glean"
version = "0.1.0"
description = "GLEAN - Grammarly Live Endpoint Analysis"
requires-python = ">=3.9"
dependencies = [
    "mitmproxy>=10",
    "rich>=13",
    "flask>=3",
]

[project.scripts]
glean = "glean.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
